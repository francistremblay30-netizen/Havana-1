 intérieur ; bancs en CP 3/8 : environ 35 lb</text><text x="452.00" y="300.20" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">de moins.</text><text x="440.00" y="311.50" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="452.00" y="311.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Revêtement en panneau d'aluminium : environ 60 lb de moins.</text><text x="440.00" y="326.80" font-size="9" text-anchor="start" font-weight="bold" fill="#111">À SAVOIR</text><text x="440.00" y="340.80" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="452.00" y="340.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">À ce poids, prévoir une motoneige utilitaire ou rouler</text><text x="452.00" y="349.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">lentement sur une trace tapée. Vérifier la capacité de</text><text x="452.00" y="358.40" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">remorquage de ta motoneige.</text><text x="440.00" y="369.70" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="452.00" y="369.70" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Chauffage propane homologué intérieur, ventilation haute et</text><text x="452.00" y="378.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">basse, détecteur de CO et extincteur obligatoires.</text><text x="440.00" y="389.80" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="452.00" y="389.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Afficher nom, adresse et téléphone ; vérifier le règlement</text><text x="452.00" y="398.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">municipal.</text></svg>