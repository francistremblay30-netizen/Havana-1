="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><circle cx="718.00" cy="163.50" r="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><circle cx="718.00" cy="235.50" r="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><text x="541.38" y="134.25" font-size="5.6" text-anchor="middle" font-weight="bold" fill="#111">ado (en hauteur)</text><text x="677.50" y="204.00" font-size="6" text-anchor="middle" font-weight="bold" fill="#111">2 adultes</text><circle cx="70" cy="336" r="4" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><text x="80.00" y="339.00" font-size="6.5" text-anchor="start" font-weight="normal" fill="#111">= une personne</text><text x="40.00" y="372.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">COMMENT ÇA MARCHE</text><text x="40.00" y="386.00" font-size="7" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="52.00" y="386.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Jour : la dînette reçoit 4 personnes. On pêche à table (T4, T5 sous la table) et sur le banc-coffre (T1, T2). Le lit de l'ado est</text><text x="52.00" y="396.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">relevé à plat contre le mur, retenu par ses chaînes.</text><text x="40.00" y="408.50" font-size="7" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="52.00" y="408.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Soir : on retire le pied de la table, la table se pose sur des tasseaux au niveau des banquettes, 2 planches d'appoint (rangées</text><text x="52.00" y="418.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">sous les banquettes) complètent : plateforme de 54 × 90 po. Les coussins des banquettes + 2 coussins d'appoint font le matelas des</text><text x="52.00" y="428.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">adultes.</text><text x="40.00" y="441.00" font-size="7" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="52.00" y="441.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">L'ado baisse son lit rabattable : 2 chaînes le tiennent à plat à 50 po du plancher, au-dessus du banc. 30 po de dégagement</text><text x="52.00" y="451.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">au-dessus du matelas.</text><text x="40.00" y="463.50" font-size="7" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="52.00" y="463.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Couvercles des trous fermés la nuit (froid et sécurité). Tout est vissé : rien ne bouge en remorquage.</text></svg>