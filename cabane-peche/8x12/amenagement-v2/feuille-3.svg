oke="#111" stroke-width="0.9"/><line x1="390.50" y1="283.25" x2="395.50" y2="278.25" stroke="#111" stroke-width="0.9"/><text x="390.50" y="331.75" font-size="5" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(-90 390.50 331.75)">2'-10"</text><line x1="176.00" y1="382.75" x2="175.00" y2="382.75" stroke="#333" stroke-width="0.45"/><line x1="176.00" y1="328.75" x2="175.00" y2="328.75" stroke="#333" stroke-width="0.45"/><line x1="178.00" y1="325.75" x2="178.00" y2="385.75" stroke="#333" stroke-width="0.45"/><line x1="175.50" y1="385.25" x2="180.50" y2="380.25" stroke="#111" stroke-width="0.9"/><line x1="175.50" y1="331.25" x2="180.50" y2="326.25" stroke="#111" stroke-width="0.9"/><text x="175.50" y="355.75" font-size="5" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(-90 175.50 355.75)">1'-6"</text><text x="450.00" y="70.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">FINITION « CHALET »</text><text x="450.00" y="84.00" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="462.00" y="84.00" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Lambris de pin aux murs et au plafond, comme la</text><text x="462.00" y="92.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">photo. Pour le poids, prendre du lambris mince 5/16</text><text x="462.00" y="101.20" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">po (environ 0,9 lb/pi²) plutôt que du 1×6 de 3/4 po.</text><text x="450.00" y="112.30" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="462.00" y="112.30" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Lambris mince sur murs et plafond : environ 290 lb,</text><text x="462.00" y="120.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">contre environ 100 lb pour le panneau 1/4 prévu. En</text><text x="462.00" y="129.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">1×6 plein, on dépasserait 400 lb.</text><text x="450.00" y="140.60" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="462.00" y="140.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Coussins de banquette en vinyle marin foncé, dessus</text><text x="462.00" y="149.20" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">de comptoir stratifié imitation pierre, plafonnier</text><text x="462.00" y="157.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">DEL 12 V au centre.</text><text x="450.00" y="168.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="462.00" y="168.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Plancher en vinyle ou en caoutchouc (pas de tapis :</text><text x="462.00" y="177.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">l'eau des trous et la neige des bottes).</text><text x="450.00" y="192.60" font-size="9" text-anchor="start" font-weight="bold" fill="#111">DORMIR EN SÉCURITÉ</text><text x="450.00" y="206.60" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="462.00" y="206.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Chauffage à ventouse (chambre de combustion scellée)</text><text x="462.00" y="215.20" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">obligatoire pour dormir, pas de chaufferette</text><text x="462.00" y="223.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">portative ouverte.</text><text x="450.00" y="234.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="462.00" y="234.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Détecteur de CO et détecteur de fumée près des lits.</text><text x="462.00" y="243.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Réchaud jamais allumé pour chauffer ni pendant le</text><text x="462.00" y="252.10" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">sommeil.</text><text x="450.00" y="263.20" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="462.00" y="263.20" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Bonbonnes à l'extérieur. Grilles de ventilation</text><text x="462.00" y="271.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">ouvertes. Extincteur ABC près de la porte.</text><text x="450.00" y="286.90" font-size="9" text-anchor="start" font-weight="bold" fill="#111">POIDS</text><text x="450.00" y="300.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="462.00" y="300.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Dînette, lit rabattable, cuisine et coussins :</text><text x="462.00" y="309.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">environ 150 lb. Avec le lambris mince : environ 340</text><text x="462.00" y="318.10" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">lb de plus que la version pêche seule.</text></svg>