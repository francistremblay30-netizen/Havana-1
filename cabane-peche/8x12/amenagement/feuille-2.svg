="#555" stroke="none" stroke-width="0.6"/><polygon points="594.25,255.75 625.75,255.75 625.75,305.25 594.25,305.25" fill="#d9ecf5" stroke="#1f5f8b" stroke-width="0.7"/><polygon points="436.75,269.25 463.75,269.25 463.75,305.25 436.75,305.25" fill="#fde2df" stroke="#c0392b" stroke-width="0.9"/><polygon points="436.75,242.25 490.75,242.25 490.75,305.25 436.75,305.25" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="3,2"/><circle cx="479.50" cy="136.50" r="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><circle cx="718.00" cy="145.50" r="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><circle cx="718.00" cy="213.00" r="7.20" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><text x="541.38" y="115.12" font-size="6" text-anchor="middle" font-weight="bold" fill="#111">ado</text><text x="673.00" y="186.00" font-size="6" text-anchor="middle" font-weight="bold" fill="#111">2 adultes</text><circle cx="70" cy="336" r="4" fill="#ffd27a" stroke="#a87b1d" stroke-width="0.6"/><text x="80.00" y="339.00" font-size="6.5" text-anchor="start" font-weight="normal" fill="#111">= une personne</text><text x="40.00" y="372.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">COMMENT ÇA MARCHE</text><text x="40.00" y="386.00" font-size="7" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="52.00" y="386.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Le soir, on range la table, on baisse le lit double et on étend le matelas de l'ado sur son banc.</text><text x="40.00" y="398.50" font-size="7" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="52.00" y="398.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Le matin, le sommier du lit monte sur 2 vérins à gaz (comme un lit coffre) et se bloque en haut : T4 et T5 sont libres, on pêche</text><text x="52.00" y="408.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">assis sur le bord de la plateforme.</text><text x="40.00" y="421.00" font-size="7" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="52.00" y="421.00" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Matelas en mousse de 4 po (ado) et 6 po (lit double), housses lavables. Rideau occultant devant le lit double.</text><text x="40.00" y="433.50" font-size="7" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="52.00" y="433.50" font-size="7" text-anchor="start" font-weight="normal" fill="#111">Tout est vissé au plancher et aux murs : rien ne bouge pendant le remorquage.</text></svg>