"0.9"/><line x1="490.25" y1="256.56" x2="495.25" y2="251.56" stroke="#111" stroke-width="0.9"/><text x="490.25" y="272.06" font-size="5" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(-90 490.25 272.06)">1'-4"</text><line x1="711.25" y1="290.06" x2="726.25" y2="290.06" stroke="#333" stroke-width="0.45"/><line x1="711.25" y1="213.56" x2="726.25" y2="213.56" stroke="#333" stroke-width="0.45"/><line x1="723.25" y1="210.56" x2="723.25" y2="293.06" stroke="#333" stroke-width="0.45"/><line x1="720.75" y1="292.56" x2="725.75" y2="287.56" stroke="#111" stroke-width="0.9"/><line x1="720.75" y1="216.06" x2="725.75" y2="211.06" stroke="#111" stroke-width="0.9"/><text x="720.75" y="251.81" font-size="5" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(-90 720.75 251.81)">2'-10"</text><line x1="639.25" y1="290.06" x2="648.25" y2="290.06" stroke="#333" stroke-width="0.45"/><line x1="639.25" y1="227.06" x2="648.25" y2="227.06" stroke="#333" stroke-width="0.45"/><line x1="645.25" y1="224.06" x2="645.25" y2="293.06" stroke="#333" stroke-width="0.45"/><line x1="642.75" y1="292.56" x2="647.75" y2="287.56" stroke="#111" stroke-width="0.9"/><line x1="642.75" y1="229.56" x2="647.75" y2="224.56" stroke="#111" stroke-width="0.9"/><text x="642.75" y="258.56" font-size="5" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(-90 642.75 258.56)">2'-4"</text><text x="40.00" y="352.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">LE COIN CUISINE</text><text x="40.00" y="366.00" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="52.00" y="366.00" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Comptoir de 42 × 20 po à 34 po de haut, dessus stratifié ou</text><text x="52.00" y="374.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">contreplaqué verni. Rebord de 1 po pour que rien ne glisse</text><text x="52.00" y="383.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">en sentier.</text><text x="40.00" y="394.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="52.00" y="394.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Le réchaud 2 feux (propane, bonbonne de 1 lb) reste à</text><text x="52.00" y="403.70" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">demeure sur une plaque inox vissée, contre la fenêtre et</text><text x="52.00" y="412.50" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">sous le ventilateur 12 V.</text><text x="40.00" y="423.80" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="52.00" y="423.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Bidon d'eau de 10 L avec robinet + bassine amovible ;</text><text x="52.00" y="432.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">rangement dessous ; étagère et crochets au-dessus.</text><text x="40.00" y="443.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="52.00" y="443.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">La glacière de 28 pintes sert de siège pour pêcher à T3 et</text><text x="52.00" y="452.70" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">de 4e place à table.</text><text x="420.00" y="352.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">DORMIR EN SÉCURITÉ (À RESPECTER)</text><text x="420.00" y="366.00" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="432.00" y="366.00" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Pour dormir, un chauffage à ventouse (prise d'air et</text><text x="432.00" y="374.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">évacuation par le mur, chambre de combustion scellée) au</text><text x="432.00" y="383.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">lieu d'une chaufferette portative ouverte.</text><text x="420.00" y="394.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="432.00" y="394.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Détecteur de monoxyde de carbone (CO) à piles près des</text><text x="432.00" y="403.70" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">lits, et détecteur de fumée. Les tester à chaque sortie.</text><text x="420.00" y="415.00" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="432.00" y="415.00" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Ne jamais laisser le réchaud allumé pour chauffer ni</text><text x="432.00" y="423.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">pendant le sommeil. Bonbonnes dehors ou dans un coffre</text><text x="432.00" y="432.60" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">ventilé vers l'extérieur.</text><text x="420.00" y="443.90" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="432.00" y="443.90" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Garder les deux grilles de ventilation ouvertes.</text><text x="432.00" y="452.70" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Extincteur ABC près de la porte.</text><text x="420.00" y="466.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">POIDS AJOUTÉ</text><text x="420.00" y="480.00" font-size="6.6" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="432.00" y="480.00" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">Lit, banc-lit, cuisine, matelas et glacière : environ</text><text x="432.00" y="488.80" font-size="6.6" text-anchor="start" font-weight="normal" fill="#111">150 à 200 lb de plus que la version pêche seule.</text></svg>