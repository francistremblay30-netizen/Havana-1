<title>Plans pied-pouce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Mise en page : la planche à dessin occupe tout l'écran ; boutons flottants en haut, outils au pouce en bas. */
:root {
  --paper: #f3f5f2;
  --sheet: #fbfcfa;
  --ink: #23292c;
  --wall: #3a4246;
  --grid: #dfe4df;
  --grid-major: #c5ccc6;
  --dim: #b8382a;
  --accent: #1d64a8;
  --accent-soft: #dce9f6;
  --muted: #69727a;
  --line: #d4d9d5;
  --chip: #e8ece8;
  --danger: #b8382a;
  --f-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-tech: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13171a; --sheet: #181d20; --ink: #dfe5e8; --wall: #c3ccd1; --grid: #232a2e; --grid-major: #313a3f;
    --dim: #ff8c72; --accent: #63adf2; --accent-soft: #1d3247; --muted: #8f9aa1; --line: #2c3438; --chip: #232a2e; --danger: #ff8c72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13171a; --sheet: #181d20; --ink: #dfe5e8; --wall: #c3ccd1; --grid: #232a2e; --grid-major: #313a3f;
  --dim: #ff8c72; --accent: #63adf2; --accent-soft: #1d3247; --muted: #8f9aa1; --line: #2c3438; --chip: #232a2e; --danger: #ff8c72;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--sheet); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: block; }
.float { position: absolute; display: flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--paper) 90%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 2px; box-shadow: 0 1px 6px color-mix(in srgb, var(--ink) 14%, transparent); }
#topL { top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 252px); min-width: 70px; padding-left: 4px; padding-right: 6px; }
#topR { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
#planName { min-width: 0; width: 100%; border: 0; background: transparent; padding: 8px 4px; font-family: var(--f-tech); font-size: 16px; font-weight: 600; text-overflow: ellipsis; }
#planName:focus { outline: none; }
.ib { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ib[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.ib:disabled { opacity: .35; }
.ib svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#saveState { font-size: 10px; color: var(--muted); white-space: nowrap; font-family: var(--f-tech); letter-spacing: .04em; text-transform: uppercase; }
#saveState:empty { display: none; }

#bottom { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 6px; pointer-events: none; }
#bottom > * { pointer-events: auto; }
#ctx { justify-self: center; width: min(560px, calc(100% - 16px)); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 7px; box-shadow: 0 2px 10px color-mix(in srgb, var(--ink) 16%, transparent); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
#ctx .ttl { font-family: var(--f-tech); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-inline: 2px; }
.len { display: inline-flex; align-items: center; gap: 2px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 1px 5px; }
.len input { width: 2.6em; border: 0; background: transparent; text-align: right; padding: 6px 2px; font-family: var(--f-tech); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.len input:focus { outline: none; }
.len select { border: 0; background: transparent; font-family: var(--f-tech); font-size: 15px; padding: 4px 0; max-width: 4.2em; }
.len .u { font-family: var(--f-tech); color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 11px; font-size: 14px; font-weight: 500; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.warn { color: var(--danger); }
.btn.arrow { width: 38px; padding: 7px 0; font-size: 17px; line-height: 1; }
.txtin { flex: 1; min-width: 7em; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 10px; }
.sel { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 8px; }
.chk { display: inline-flex; align-items: center; gap: 8px; }

#tools { display: flex; background: var(--paper); border-top: 1px solid var(--line); padding: 2px max(4px, env(safe-area-inset-right, 0px)) calc(2px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
#tools button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; border-radius: 10px; padding: 5px 0 3px; display: grid; justify-items: center; gap: 1px; color: var(--muted); font-family: var(--f-tech); font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
#tools button svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#tools button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }

/* feuille Menu */
#sheetWrap { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
#sheet { background: var(--paper); width: 100%; max-width: 560px; max-height: 85%; overflow-y: auto; border-radius: 14px 14px 0 0; padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
#sheet h2 { font-family: var(--f-tech); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plans { display: grid; gap: 4px; }
.plan { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.plan.cur { border-color: var(--accent); }
.plan .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; text-align: left; padding: 4px 0; font-weight: 500; }
.plan .d { font-size: 12px; color: var(--muted); font-family: var(--f-tech); }
.set { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.4; margin: 0; max-width: 60ch; }
#toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); text-align: center; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: 90vw; }
@media (prefers-reduced-motion: no-preference) { #sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6 } } }
</style>

<div id="app">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="topL" class="float"><input id="planName" aria-label="Nom du plan" value="Nouveau plan" autocomplete="off"><span id="saveState"></span></div>
  <div id="topR" class="float">
    <button class="ib" id="ortho" aria-label="Équerre 45° et 90°" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 4v15h15"/><path d="M5 13h6v6"/></svg></button>
    <button class="ib" id="undo" aria-label="Annuler"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redo" aria-label="Rétablir"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ib" id="fit" aria-label="Tout voir"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="bottom">
    <section id="ctx" hidden></section>
    <nav id="tools" aria-label="Outils"></nav>
  </div>
</div>
<div id="sheetWrap" hidden><div id="sheet" class="pad" role="dialog" aria-label="Menu"></div></div>
<div id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const svg = $("#cv");
const NS = "http://www.w3.org/2000/svg";

// ---------- réglages ----------
const SNAPS = [0, 1, 3, 6, 12];
const PRECS = [16, 8, 4, 2, 1];
const THICKS = [3.5, 4.5, 5.5, 6, 6.5, 8];
let settings = { snap: 6, prec: 8, thick: 4.5, ortho: true, autoDims: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem("ppp.settings") || "{}")); } catch (e) {}
function saveSettings() { try { localStorage.setItem("ppp.settings", JSON.stringify(settings)); } catch (e) {} }

// ---------- pieds-pouces ----------
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function fmt(inches, prec = settings.prec) {
  const q = Math.round(Math.abs(inches) * prec);
  const ft = Math.floor(q / (12 * prec));
  const r = q - ft * 12 * prec;
  const ip = Math.floor(r / prec), fr = r - ip * prec;
  let frs = "";
  if (fr) { const g = gcd(fr, prec); frs = " " + fr / g + "/" + prec / g; }
  if (ft === 0) return (ip ? ip + frs : frs ? frs.trim() : "0") + '"';
  return ft + "'-" + ip + frs + '"';
}
function fmtArea(sqin) { const v = sqin / 144; return (v >= 100 ? Math.round(v) : v.toFixed(1)).toString().replace(".", ",") + " pi²"; }
function splitLen(L) {
  const q = Math.round(L * 16); const ft = Math.floor(q / 192); const r = q - ft * 192;
  const ip = Math.floor(r / 16); const fr = r - ip * 16; return { ft, ip, fr };
}
const FRACS = [[0, "—"], [2, "1/8"], [4, "1/4"], [6, "3/8"], [8, "1/2"], [10, "5/8"], [12, "3/4"], [14, "7/8"], [1, "1/16"], [3, "3/16"], [5, "5/16"], [7, "7/16"], [9, "9/16"], [11, "11/16"], [13, "13/16"], [15, "15/16"]];
function lenHTML(id, L) {
  const { ft, ip, fr } = splitLen(L || 0);
  const opts = FRACS.map(([v, t]) => `<option value="${v}"${v === fr ? " selected" : ""}>${t}</option>`).join("");
  return `<span class="len"><input id="${id}-ft" inputmode="numeric" value="${L ? ft : ""}" placeholder="0" aria-label="pieds"><span class="u">pi</span>` +
    `<input id="${id}-in" inputmode="decimal" value="${L ? ip : ""}" placeholder="0" aria-label="pouces"><select id="${id}-fr" aria-label="fraction">${opts}</select><span class="u">po</span></span>`;
}
function readLen(id) {
  const n = (v) => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };
  return n($("#" + id + "-ft").value) * 12 + n($("#" + id + "-in").value) + n($("#" + id + "-fr").value) / 16;
}

// ---------- géométrie ----------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = (a) => Math.hypot(a[0], a[1]);
const dist = (a, b) => len(sub(a, b));
const unit = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const r64 = (v) => Math.round(v * 64) / 64;
const rp = (p) => [r64(p[0]), r64(p[1])];
function segDist(p, a, b) {
  const ab = sub(b, a), t = Math.max(0, Math.min(1, ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / ((ab[0] ** 2 + ab[1] ** 2) || 1)));
  return dist(p, add(a, mul(ab, t)));
}
const uid = () => "e" + Math.random().toString(36).slice(2, 9);

// ---------- état ----------
let plan = null;            // {id, name, els, updatedAt, example}
let view = { s: 3, tx: 0, ty: 0 };
let tool = "wall";
let sel = null;             // {id, seg}
let chain = null;           // id de l'élément mur/ligne en cours
let draft = null;           // aperçu pendant un geste
let hist = [], hi = -1;

function exemple() {
  const r = (x, y, w, h, o = {}) => ({ id: uid(), type: "rect", x, y, w, h, thick: 0, area: false, dims: true, ...o });
  return {
    id: "p" + Date.now().toString(36), name: "Cabane à pêche 8 × 10", example: true, updatedAt: 0,
    els: [
      r(0, 0, 96, 120, { thick: 3.5, area: true }),
      r(3.5, 3.5, 12, 113, { dims: false }), r(80.5, 3.5, 12, 113, { dims: false }),
      r(18, 34, 12, 12, { dims: false }), r(18, 82, 12, 12, { dims: false }),
      r(66, 34, 12, 12), r(66, 82, 12, 12, { dims: false }),
      r(40, 6, 16, 12, { dims: false }),
      { id: uid(), type: "door", a: [80, 120], b: [50, 120], side: 1, thick: 3.5, dims: true },
      { id: uid(), type: "dim", a: [30, 28], b: [66, 28] },
      { id: uid(), type: "text", p: [9.5, 62], text: "BANC", size: 4 },
      { id: uid(), type: "text", p: [86.5, 62], text: "BANC", size: 4 },
      { id: uid(), type: "text", p: [48, 13.5], text: "CHAUFFAGE", size: 2.6 },
      { id: uid(), type: "text", p: [24, 41], text: "T1", size: 4 }, { id: uid(), type: "text", p: [24, 89], text: "T2", size: 4 },
      { id: uid(), type: "text", p: [72, 89], text: "T4", size: 4 },
    ],
  };
}
function nouveauPlan() { return { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: "Nouveau plan", els: [], updatedAt: Date.now() }; }

function loadLocal() {
  try { const p = JSON.parse(localStorage.getItem("ppp.current") || "null"); if (p && Array.isArray(p.els)) return p; } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem("ppp.current", JSON.stringify(plan)); } catch (e) {} }

function setPlan(p, fit = true) {
  plan = JSON.parse(JSON.stringify(p));
  sel = null; chain = null; draft = null;
  hist = [JSON.stringify(plan.els)]; hi = 0;
  $("#planName").value = plan.name || "Sans nom";
  if (fit) fitView();
  saveLocal(); refresh();
}
function commit() {
  hist = hist.slice(0, hi + 1); hist.push(JSON.stringify(plan.els)); if (hist.length > 120) hist.shift(); hi = hist.length - 1;
  plan.updatedAt = Date.now(); plan.example = false;
  saveLocal(); scheduleRemote(); refresh();
}
function undo() { if (hi > 0) { hi--; plan.els = JSON.parse(hist[hi]); sel = null; chain = null; plan.updatedAt = Date.now(); saveLocal(); scheduleRemote(); refresh(); } }
function redo() { if (hi < hist.length - 1) { hi++; plan.els = JSON.parse(hist[hi]); sel = null; chain = null; plan.updatedAt = Date.now(); saveLocal(); scheduleRemote(); refresh(); } }
const byId = (id) => plan.els.find((e) => e.id === id);

// ---------- vue ----------
const W2S = (p) => [p[0] * view.s + view.tx, p[1] * view.s + view.ty];
const S2W = (p) => [(p[0] - view.tx) / view.s, (p[1] - view.ty) / view.s];
function bounds(els) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const pt = (p) => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); };
  for (const e of els) {
    if (e.type === "rect") { pt([e.x, e.y]); pt([e.x + e.w, e.y + e.h]); }
    else if (e.type === "wall" || e.type === "line") e.pts.forEach(pt);
    else if (e.type === "door") { pt(e.a); pt(e.b); pt(doorLeaf(e)); }
    else if (e.type === "dim") { pt(e.a); pt(e.b); }
    else if (e.type === "text") pt(e.p);
  }
  return isFinite(x0) ? { x0, y0, x1, y1 } : null;
}
function fitView() {
  const r = svg.getBoundingClientRect();
  const b = bounds(plan.els) || { x0: 0, y0: 0, x1: 144, y1: 120 };
  const w = Math.max(b.x1 - b.x0, 24), h = Math.max(b.y1 - b.y0, 24);
  const top = 64, bot = 150, availH = Math.max(120, r.height - top - bot);
  const s = Math.min((r.width - 70) / w, (availH - 30) / h);
  view.s = Math.max(0.15, Math.min(60, s));
  view.tx = r.width / 2 - ((b.x0 + b.x1) / 2) * view.s;
  view.ty = top + availH / 2 - ((b.y0 + b.y1) / 2) * view.s;
  render();
}

// ---------- segments et cotes ----------
function polyArea(pts) { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
function segsOf(e) {
  if (e.type === "wall" || e.type === "line") {
    const s = []; for (let i = 0; i < e.pts.length - 1; i++) s.push([e.pts[i], e.pts[i + 1]]);
    if (e.closed && e.pts.length > 2) s.push([e.pts[e.pts.length - 1], e.pts[0]]);
    return s;
  }
  if (e.type === "rect") { const a = [e.x, e.y], b = [e.x + e.w, e.y], c = [e.x + e.w, e.y + e.h], d = [e.x, e.y + e.h]; return [[a, b], [b, c], [c, d], [d, a]]; }
  if (e.type === "dim" || e.type === "door") return [[e.a, e.b]];
  return [];
}
function doorLeaf(e) { const d = sub(e.b, e.a), n = unit([d[1], -d[0]]); return add(e.a, mul(n, len(d) * (e.side || 1))); }

// cotes automatiques d'un élément : [{a, b, off(px), side}]
function dimsOf(e) {
  if (!settings.autoDims || e.dims === false) return [];
  if (e.type === "rect") return [{ a: [e.x, e.y], b: [e.x + e.w, e.y], off: 16 }, { a: [e.x, e.y + e.h], b: [e.x, e.y], off: 16 }];
  if (e.type === "wall" || e.type === "line") {
    const segs = segsOf(e); let sgn = e.flip ? -1 : 1;
    if (e.closed && e.pts.length > 2) sgn = polyArea(e.pts) > 0 ? 1 : -1;
    const half = e.type === "wall" ? (e.thick || 0) / 2 : 0;
    return segs.map(([a, b]) => ({ a, b, off: sgn * (half * view.s + 14) }));
  }
  if (e.type === "door") { const d = sub(e.b, e.a); return [{ a: e.a, b: e.b, off: -(e.side || 1) * ((e.thick || 0) / 2 * view.s + 14) }]; }
  if (e.type === "dim") return [{ a: e.a, b: e.b, off: 0, manual: true }];
  return [];
}

// ---------- rendu ----------
function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function pathOf(pts, close) { return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + (close ? " Z" : ""); }

function drawDim(g, d, color, label) {
  const A = W2S(d.a), B = W2S(d.b), v = sub(B, A), L = len(v);
  if (L < 6) return;
  const n = unit([v[1], -v[0]]), o = mul(n, d.off);
  const a = add(A, o), b = add(B, o), u = unit(v);
  const st = `stroke:${color};stroke-width:1;fill:none`;
  if (Math.abs(d.off) > 0.5) {
    const ext = mul(n, Math.sign(d.off) * 4), gap = mul(n, Math.sign(d.off) * 3);
    el("path", { d: pathOf([add(A, gap), add(a, ext)]) + pathOf([add(B, gap), add(b, ext)]), style: st }, g);
  }
  el("path", { d: pathOf([sub(a, mul(u, 5)), add(b, mul(u, 5))]), style: st }, g);
  const t = [u[0] + n[0], u[1] + n[1]].map((x) => x * 3.5);
  el("path", { d: pathOf([sub(a, t), add(a, t)]) + pathOf([sub(b, t), add(b, t)]), style: `stroke:${color};stroke-width:1.8;fill:none` }, g);
  let ang = Math.atan2(v[1], v[0]) * 180 / Math.PI; if (ang > 90.01 || ang <= -90) ang += 180;
  const mid = mul(add(a, b), 0.5);
  const txt = label || fmt(dist(d.a, d.b));

    const m2 = add(mid, mul(n, Math.sign(d.off || 1) * 12));

  dim: "Glisse d'un point à l'autre pour ajouter une cote.",
  text: "Touche la planche pour poser un texte.",
  pan: "Glisse pour déplacer la vue. Deux doigts pour zoomer.",
};
let moreOpen = false;
function ctxHTML() {
  const se = sel && byId(sel.id);
  if (se) return propsHTML(se);
  const c = chain && byId(chain);
  if ((tool === "wall" || tool === "line") && c) {
    return lenHTML("nx", 0) +
      `<button class="btn arrow" data-dir="r" aria-label="vers la droite">→</button><button class="btn arrow" data-dir="d" aria-label="vers le bas">↓</button><button class="btn arrow" data-dir="l" aria-label="vers la gauche">←</button><button class="btn arrow" data-dir="u" aria-label="vers le haut">↑</button>` +
      (c.pts.length >= 3 ? `<button class="btn" id="b-close">Fermer</button>` : "") + `<button class="btn pri" id="b-end">Terminer</button>`;
  }
  if (tool === "rect") return `<label class="chk"><input type="checkbox" id="o-roomwalls"${settings.roomWalls ? " checked" : ""}> Pièce avec murs de ${fmt(settings.thick, 8)}</label>`;
  return "";
}
function propsHTML(e) {
  const tail = `<button class="btn warn" id="b-del" aria-label="Supprimer">Suppr.</button>` +
    (moreOpen ? "" : `<button class="btn" id="b-more">Plus</button>`) + `<button class="btn" id="b-desel">OK</button>`;
  const more = (x) => (moreOpen ? x + `<button class="btn" id="b-dup">Dupliquer</button>` : "");
  const dimsBtn = `<button class="btn" id="b-edims">${e.dims === false ? "Afficher" : "Masquer"} les cotes</button>`;
  if (e.type === "wall" || e.type === "line") {
    const k = sel.seg ?? 0, sg = segsOf(e)[k]; const L = sg ? dist(sg[0], sg[1]) : 0;
    return lenHTML("sl", L) + `<button class="btn pri" id="b-setlen">OK long.</button>` + tail + more(
      `<span class="ttl">Segment ${k + 1}/${segsOf(e).length}</span>` +
      (e.type === "wall" ? `<select class="sel" id="p-thick" aria-label="épaisseur">${THICKS.map((t) => `<option value="${t}"${t === e.thick ? " selected" : ""}>Épaisseur ${fmt(t, 8)}</option>`).join("")}</select>` : "") +
      (e.closed ? "" : `<button class="btn" id="b-flip">Cotes de l'autre côté</button><button class="btn" id="b-cont">Continuer le tracé</button>`) + dimsBtn);
  }
  if (e.type === "rect") {
    return `<span class="ttl">L</span>${lenHTML("rw", e.w)}<span class="ttl">P</span>${lenHTML("rh", e.h)}<button class="btn pri" id="b-setrect">OK</button>` + tail + more(
      `<select class="sel" id="p-rthick" aria-label="murs"><option value="0"${!e.thick ? " selected" : ""}>Sans murs</option>${THICKS.map((t) => `<option value="${t}"${t === e.thick ? " selected" : ""}>Murs ${fmt(t, 8)}</option>`).join("")}</select>` +
      `<button class="btn" id="b-area">${e.area ? "Masquer" : "Afficher"} la surface</button>` + dimsBtn);
  }
  if (e.type === "door") return lenHTML("dw", dist(e.a, e.b)) + `<button class="btn pri" id="b-setdoor">OK</button><button class="btn" id="b-swing">Inverser</button>` + tail + more(`<button class="btn" id="b-hinge">Penture de l'autre bord</button>`);
  if (e.type === "dim") return `<span class="ttl">Cote ${fmt(dist(e.a, e.b))}</span>` + tail + more("");
  if (e.type === "text") return `<input class="txtin" id="p-text" value="${(e.text || "").replace(/"/g, "&quot;")}" aria-label="texte">` + tail + more(`<select class="sel" id="p-tsize" aria-label="taille">${[2, 3, 4, 6, 9, 12, 18].map((v) => `<option value="${v}"${v === e.size ? " selected" : ""}>Taille ${v} po</option>`).join("")}</select>`);
  return tail;
}
let lastCtxKey = "";
function refresh() {
  const key = (sel ? sel.id + ":" + sel.seg : "") + "|" + tool + "|" + chain + "|" + moreOpen;
  if (key !== lastCtxKey) moreOpen = moreOpen && !!sel && lastCtxKey.split("|")[0] === key.split("|")[0];
  const html = ctxHTML(); const ctx = $("#ctx");
  ctx.innerHTML = html; ctx.hidden = !html;
  lastCtxKey = (sel ? sel.id + ":" + sel.seg : "") + "|" + tool + "|" + chain + "|" + moreOpen;
  for (const b of document.querySelectorAll("#tools button")) b.setAttribute("aria-pressed", String(b.dataset.t === tool));
  $("#ortho").setAttribute("aria-pressed", String(settings.ortho));
  $("#undo").disabled = hi <= 0; $("#redo").disabled = hi >= hist.length - 1;
  render();
}
$("#ortho").addEventListener("click", () => { settings.ortho = !settings.ortho; saveSettings(); toast(settings.ortho ? "Équerre activée : angles de 45° et 90°." : "Équerre désactivée : angles libres."); refresh(); });
$("#ctx").addEventListener("change", (ev) => {
  const e = sel && byId(sel.id);
  if (ev.target.id === "o-roomwalls") { settings.roomWalls = ev.target.checked; saveSettings(); return; }
  if (!e) return;
  if (ev.target.id === "p-thick") { e.thick = +ev.target.value; commit(); }
  if (ev.target.id === "p-rthick") { e.thick = +ev.target.value; commit(); }
  if (ev.target.id === "p-tsize") { e.size = +ev.target.value; commit(); }
  if (ev.target.id === "p-text") { e.text = ev.target.value || "Texte"; commit(); }
});
$("#ctx").addEventListener("input", (ev) => { if (ev.target.id === "p-text") { const e = byId(sel.id); e.text = ev.target.value; render(); } });
$("#ctx").addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  if (ev.target.closest(".len")) { const b = $("#b-setlen") || $("#b-setrect") || $("#b-setdoor"); if (b) b.click(); else if (chain) toast("Choisis une direction avec les flèches."); }
  if (ev.target.id === "p-text") ev.target.blur();
});
$("#ctx").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  const e = sel && byId(sel.id);
  if (b.dataset.dir) {
    const c = byId(chain); const L = readLen("nx"); if (!(L > 0)) { toast("Entre une longueur d'abord."); return; }
    const d = { r: [1, 0], l: [-1, 0], u: [0, -1], d: [0, 1] }[b.dataset.dir];
    appendPt(rp(add(c.pts[c.pts.length - 1], mul(d, L))));
    setTimeout(() => { const i = $("#nx-ft"); if (i) i.focus(); }, 20); return;
  }
  if (b.id === "b-end") { endChain(); return; }
  if (b.id === "b-close") { const c = byId(chain); c.closed = true; chain = null; commit(); return; }
  if (!e) return;
  if (b.id === "b-desel") { sel = null; refresh(); return; }
  if (b.id === "b-more") { moreOpen = true; refresh(); return; }
  if (b.id === "b-del") { plan.els = plan.els.filter((x) => x !== e); sel = null; commit(); return; }
  if (b.id === "b-dup") { const c = JSON.parse(JSON.stringify(e)); c.id = uid(); Object.assign(c, translate(c, [12, 12])); plan.els.push(c); sel = { id: c.id }; commit(); return; }
  if (b.id === "b-edims") { e.dims = e.dims === false; commit(); return; }
  if (b.id === "b-flip") { e.flip = !e.flip; commit(); return; }
  if (b.id === "b-area") { e.area = !e.area; commit(); return; }
  if (b.id === "b-cont") { chain = e.id; sel = null; tool = e.type; refresh(); return; }
  if (b.id === "b-swing") { e.side = -(e.side || 1); commit(); return; }
  if (b.id === "b-hinge") { [e.a, e.b] = [e.b, e.a]; e.side = -(e.side || 1); commit(); return; }
  if (b.id === "b-setlen") {
    const L = readLen("sl"); if (!(L > 0)) return toast("Longueur invalide.");
    const k = sel.seg ?? 0, n = e.pts.length, ia = k, ib = (k + 1) % n;
    const a = e.pts[ia], bb = e.pts[ib], nb = rp(add(a, mul(unit(sub(bb, a)), L))), d = sub(nb, bb);
    if (e.closed) e.pts[ib] = nb; else for (let i = ib; i < n; i++) e.pts[i] = rp(add(e.pts[i], d));
    commit(); return;
  }
  if (b.id === "b-setrect") { const w = readLen("rw"), h = readLen("rh"); if (!(w > 0 && h > 0)) return toast("Dimensions invalides."); e.w = r64(w); e.h = r64(h); commit(); return; }
  if (b.id === "b-setdoor") { const L = readLen("dw"); if (!(L > 0)) return toast("Largeur invalide."); e.b = rp(add(e.a, mul(unit(sub(e.b, e.a)), L))); commit(); return; }
});

$("#undo").onclick = undo; $("#redo").onclick = redo; $("#fit").onclick = fitView;
$("#planName").addEventListener("change", () => { plan.name = $("#planName").value.trim() || "Sans nom"; plan.updatedAt = Date.now(); plan.example = false; saveLocal(); scheduleRemote(); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,select")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.key === "Escape") { if (chain) endChain(); else { sel = null; refresh(); } }
  if ((e.key === "Delete" || e.key === "Backspace") && sel) { plan.els = plan.els.filter((x) => x.id !== sel.id); sel = null; commit(); }
});
let tT; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => (t.hidden = true), 2400); }

// ---------- enregistrement ----------
let db = null, col = null, dl = null, plans = [], remoteOK = false, saving = false, again = false, timer = null, firstSnap = true;
function setSave(s) { $("#saveState").textContent = s; }
function scheduleRemote() {
  if (!col) { setSave(remoteOK === null ? "" : "Local"); return; }
  setSave("…"); clearTimeout(timer); timer = setTimeout(pushRemote, 1200);
}
async function pushRemote() {
  if (!col) return;
  if (saving) { again = true; return; }
  saving = true;
  const body = { name: plan.name, els: plan.els, updatedAt: plan.updatedAt, v: 1 };
  try { await col.doc(plan.id).set(body); setSave("Enregistré"); }
  catch (err) {
    const c = err && err.code;
    if (c === "quota_exceeded") toast("Espace plein : supprime d'anciens plans pour enregistrer.");
    else if (c === "invalid_argument") { col = null; toast("Enregistrement en ligne refusé : le plan reste sur cet appareil."); }
    setSave("Local");
  }
  saving = false; if (again) { again = false; pushRemote(); }
}
(async () => {
  if (!window.claude || !window.claude.use) { setSave("Local"); return; }
  try {
    const [user, d, downloads] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("downloads")]);
    dl = downloads;
    const id = user ? await user.id() : null;
    if (!d || !id) { setSave("Local"); return; }
    db = d; col = db.collection("data/users/" + id); remoteOK = true; setSave("");
    const wait = setTimeout(() => { if (firstSnap) setSave("Hors ligne"); }, 10000);
    col.onSnapshot((snap) => {
      plans = snap.docs.map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!snap.metadata.fromCache) clearTimeout(wait);
      const mine = plans.find((p) => p.id === plan.id);
      if (firstSnap && !snap.metadata.fromCache) {
        firstSnap = false;
        if (plan.example && plans.length) setPlan(plans[0]);
        else if (mine && (mine.updatedAt || 0) > (plan.updatedAt || 0) && !act) setPlan(mine, false);
        else if (!plan.example && (!mine || (mine.updatedAt || 0) < (plan.updatedAt || 0))) scheduleRemote();
        else setSave("Enregistré");
      }
      if (!$("#sheetWrap").hidden && sheetView === "main") drawSheet();
    }, () => { col = null; setSave("Local"); });
  } catch (e) { setSave("Local"); }
})();

// ---------- menu ----------
let sheetView = "main", confirmDel = null;
$("#menuBtn").onclick = () => { sheetView = "main"; confirmDel = null; drawSheet(); $("#sheetWrap").hidden = false; };
$("#sheetWrap").addEventListener("click", (e) => { if (e.target.id === "sheetWrap") $("#sheetWrap").hidden = true; });
function dateFr(t) { if (!t) return ""; const d = new Date(t); return d.toLocaleDateString("fr-CA", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" }); }
function drawSheet() {
  const list = col ? plans : [];
  const rows = list.map((p) => `<div class="plan${p.id === plan.id ? " cur" : ""}"><button class="n" data-open="${p.id}"></button><span class="d">${dateFr(p.updatedAt)}</span><button class="btn warn" data-del="${p.id}">${confirmDel === p.id ? "Confirmer" : "Supprimer"}</button></div>`).join("");
  $("#sheet").innerHTML = `
  <div><h2>Mes plans</h2>
    <div class="plans">${rows || `<p class="note">${col ? "Aucun plan enregistré pour l'instant. Le plan en cours s'enregistre dès ta première modification." : "Les plans sont gardés sur cet appareil seulement (enregistrement en ligne non disponible ici)."}</p>`}</div>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="s-new">Nouveau plan</button><button class="btn" id="s-ex">Ouvrir l'exemple de cabane</button></div></div>
  <div><h2>Exporter</h2>
    <div class="row"><button class="btn" id="s-png">Image PNG</button><button class="btn" id="s-svg">Dessin SVG</button></div>
    ${dl ? "" : `<p class="note" style="margin-top:6px">Le téléchargement n'est pas offert dans cette vue. Ouvre la page dans claude.ai pour exporter.</p>`}</div>
  <div><h2>Réglages</h2><div class="set">
    <span>Équerre (angles 45° et 90°)</span><input type="checkbox" id="s-ortho"${settings.ortho ? " checked" : ""}>
    <span>Cotes automatiques</span><input type="checkbox" id="s-dims"${settings.autoDims ? " checked" : ""}>
    <span>Aimantation de la grille</span><select class="sel" id="s-snap">${SNAPS.map((v) => `<option value="${v}"${v === settings.snap ? " selected" : ""}>${v ? fmt(v, 1) : "libre"}</option>`).join("")}</select>
    <span>Précision des cotes</span><select class="sel" id="s-prec">${PRECS.map((v) => `<option value="${v}"${v === settings.prec ? " selected" : ""}>${v === 1 ? "pouce entier" : "1/" + v + " po"}</option>`).join("")}</select>
    <span>Épaisseur des murs</span><select class="sel" id="s-thick">${THICKS.map((v) => `<option value="${v}"${v === settings.thick ? " selected" : ""}>${fmt(v, 8)}</option>`).join("")}</select>
  </div><p class="note" style="margin-top:8px">2×3 + revêtement ≈ 3 1/2 po · 2×4 + gypse des deux côtés ≈ 4 1/2 po · mur extérieur 2×6 ≈ 6 1/2 po.</p></div>
  <div class="row"><button class="btn" id="s-close">Fermer</button></div>`;
  for (const b of document.querySelectorAll("[data-open]")) b.textContent = (plans.find((p) => p.id === b.dataset.open) || {}).name || "Sans nom";
}
$("#sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "s-close") { $("#sheetWrap").hidden = true; return; }
  if (b.dataset.open) { const p = plans.find((x) => x.id === b.dataset.open); if (p) setPlan(p); $("#sheetWrap").hidden = true; return; }
  if (b.dataset.del) {
    if (confirmDel !== b.dataset.del) { confirmDel = b.dataset.del; drawSheet(); return; }
    try { await col.doc(b.dataset.del).delete(); if (b.dataset.del === plan.id) setPlan(nouveauPlan()); toast("Plan supprimé."); } catch (err) { toast("Suppression impossible pour l'instant."); }
    confirmDel = null; drawSheet(); return;
  }
  if (b.id === "s-new") { setPlan(nouveauPlan()); setTool("wall"); $("#sheetWrap").hidden = true; scheduleRemote(); return; }
  if (b.id === "s-ex") { const p = exemple(); setPlan(p); $("#sheetWrap").hidden = true; return; }
  if (b.id === "s-png" || b.id === "s-svg") { exporter(b.id === "s-png" ? "png" : "svg"); return; }
});
$("#sheet").addEventListener("change", (e) => {
  if (e.target.id === "s-ortho") settings.ortho = e.target.checked;
  if (e.target.id === "s-dims") settings.autoDims = e.target.checked;
  if (e.target.id === "s-snap") settings.snap = +e.target.value;
  if (e.target.id === "s-prec") settings.prec = +e.target.value;
  if (e.target.id === "s-thick") settings.thick = +e.target.value;

});

// ---------- export ----------
function exportSVG() {
  const b = bounds(plan.els); if (!b) return null;
  const pad = 60, maxPx = 1800;
  const s = Math.min(maxPx / Math.max(b.x1 - b.x0, 1), maxPx / Math.max(b.y1 - b.y0, 1), 12);
  const W = Math.round((b.x1 - b.x0) * s + pad * 2), H = Math.round((b.y1 - b.y0) * s + pad * 2 + 40);
  const saved = { view, sel, draft, chain }; view = { s, tx: pad - b.x0 * s, ty: pad - b.y0 * s }; sel = null; draft = null; chain = null;
  const holder = document.createElementNS(NS, "svg");
  const css = getComputedStyle(document.documentElement);
  const tok = (n) => css.getPropertyValue(n).trim();
  const colors = { "--wall": "#3a4246", "--ink": "#23292c", "--dim": "#b8382a", "--sheet": "#ffffff", "--muted": "#69727a", "--accent": "#1d64a8", "--f-tech": "'Barlow Condensed','Arial Narrow',sans-serif" };
  const sub2 = (str) => str.replace(/var\((--[a-z-]+)\)/g, (m, n) => colors[n] || tok(n));
  const g = el("g", {}, holder);
  for (const e of [...plan.els].sort((a, c) => (a.type === "rect" && a.thick ? -1 : 0) - (c.type === "rect" && c.thick ? -1 : 0))) { drawEl(g, e, { labels: true }); for (const d of dimsOf(e)) drawDim(g, d, "var(--dim)"); }
  Object.assign(window, {}); view = saved.view; sel = saved.sel; draft = saved.draft; chain = saved.chain;
  const style = `.dimt{font:600 13px 'Barlow Condensed','Arial Narrow',sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.areat{font:600 14px 'Barlow Condensed','Arial Narrow',sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}.lbl{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}`;
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const foot = `<text x="${pad}" y="${H - 22}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="18" font-weight="700" fill="#23292c">${esc(plan.name || "Plan")}</text><text x="${W - pad}" y="${H - 22}" text-anchor="end" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="14" fill="#69727a">Cotes en pieds-pouces · ${new Date().toLocaleDateString("fr-CA")}</text>`;
  return { W, H, text: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><style>${style}</style><rect width="100%" height="100%" fill="#ffffff"/>${sub2(g.outerHTML)}${foot}</svg>` };
}
async function exporter(kind) {
  if (!dl) { toast("Le téléchargement n'est pas offert dans cette vue."); return; }
  const out = exportSVG(); if (!out) { toast("Le plan est vide."); return; }
  const base = (plan.name || "plan").replace(/[^\p{L}\p{N} _-]+/gu, "").trim().replace(/\s+/g, "_") || "plan";
  try {
    if (kind === "svg") { await dl.save({ filename: base + ".svg", data: out.text }); }
    else {
      const img = new Image(); const url = URL.createObjectURL(new Blob([out.text], { type: "image/svg+xml" }));
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const c = document.createElement("canvas"); c.width = out.W * 2; c.height = out.H * 2;
      const x = c.getContext("2d"); x.scale(2, 2); x.drawImage(img, 0, 0); URL.revokeObjectURL(url);
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      await dl.save({ filename: base + ".png", data: blob });
    }
    toast("Fichier prêt.");
  } catch (err) {
    const c = err && err.code;
    if (c === "declined") return;
    toast(c === "rate_limited" ? "Une demande est déjà ouverte. Réessaie dans un instant." : "Export impossible dans cette vue.");
  }
}

// ---------- démarrage ----------
new ResizeObserver(() => render()).observe($("#app"));
const start = loadLocal();
plan = start || exemple();
setPlan(plan);
setSave(window.claude ? "" : "Local");
if (plan.example) setTimeout(() => toast("Exemple : la cabane 8 × 10. Menu ☰ → Nouveau plan pour partir à neuf."), 400);
})();
</script>
