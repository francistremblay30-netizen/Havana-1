text><line x1="60.00" y1="310.00" x2="60.00" y2="373.00" stroke="#333" stroke-width="0.45"/><line x1="600.00" y1="310.00" x2="600.00" y2="373.00" stroke="#333" stroke-width="0.45"/><line x1="57.00" y1="370.00" x2="603.00" y2="370.00" stroke="#333" stroke-width="0.45"/><line x1="57.50" y1="372.50" x2="62.50" y2="367.50" stroke="#111" stroke-width="0.9"/><line x1="597.50" y1="372.50" x2="602.50" y2="367.50" stroke="#111" stroke-width="0.9"/><text x="330.00" y="367.50" font-size="7" text-anchor="middle" font-weight="normal" fill="#111">15'-0" hors-tout avec timon</text><text x="40.00" y="420.00" font-size="9" text-anchor="start" font-weight="bold" fill="#111">NOTES</text><text x="40.00" y="434.00" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">1.</text><text x="52.00" y="434.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Cabane 5'-0" × 10'-0" (1,52 × 3,05 m). Longueur avec timon</text><text x="52.00" y="443.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">15'-0". Étroite et basse : elle suit la trace de la motoneige</text><text x="52.00" y="453.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">et passe dans les sentiers.</text><text x="40.00" y="465.00" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">2.</text><text x="52.00" y="465.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Ossature légère : murs 2×2 @ 24 po c/c, revêtement CP 1/4,</text><text x="52.00" y="474.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">toit en pointe (2 versants) pente 8:12 en tôle.</text><text x="40.00" y="486.50" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">3.</text><text x="52.00" y="486.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">3 trappes de 12 × 12 po devant le banc, entre les traverses du</text><text x="52.00" y="496.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">plancher : on pêche assis, le trou entre les pieds.</text><text x="40.00" y="508.00" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">4.</text><text x="52.00" y="508.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Banc de 14 po sur toute la longueur, couvercles à charnières :</text><text x="52.00" y="517.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">cannes, tarière courte et sac dessous.</text><text x="410.00" y="434.00" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">5.</text><text x="422.00" y="434.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Allée de 26 po. Porte 24 × 60 po au pignon arrière, ouvre vers</text><text x="422.00" y="443.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">l'extérieur.</text><text x="410.00" y="455.50" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">6.</text><text x="422.00" y="455.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Chauffage propane portatif homologué pour l'intérieur, dans le</text><text x="422.00" y="465.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">coin avant, sur plaque incombustible.</text><text x="410.00" y="477.00" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">7.</text><text x="422.00" y="477.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Ventilation : grille basse dans la porte, grille haute au</text><text x="422.00" y="486.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">pignon avant. Détecteur de CO et extincteur obligatoires.</text><text x="410.00" y="498.50" font-size="7.2" text-anchor="start" font-weight="bold" fill="#111">8.</text><text x="422.00" y="498.50" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">Afficher nom, adresse et téléphone ; vérifier le règlement</text><text x="422.00" y="508.00" font-size="7.2" text-anchor="start" font-weight="normal" fill="#111">municipal (dates de pose et de retrait).</text></svg>